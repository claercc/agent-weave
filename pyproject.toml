[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-backend"
version = "0.1.0"
description = "AI Agent Backend Service - A comprehensive backend for AI-powered agents with RAG, tool calling, and workflow management"
authors = [
  { name = "Developer", email = "developer@example.com" }
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.139.0",
  "uvicorn>=0.29.0",
  "python-dotenv>=1.0.0",
  "anyio>=4.14.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "annotated-types>=0.7.0",
  "requests>=2.32.0",
  "langchain>=0.1.0",
  "langchain-openai>=0.1.0",
  "langchain-text-splitters>=1.1,<2.0",
  "openai>=1.30.0",
  "chromadb>=0.4.0",
  "tenacity>=8.2.0",
  "python-multipart>=0.0.9",
  "pypdf>=5.0.0",
  "pymupdf>=1.26.0",
  "rapidocr>=3.9.0,<4.0",
  "onnxruntime>=1.20.0",
  "numpy>=1.26.0,<3.0",
  "pillow>=10.0.0",
  "langgraph>=1.2,<2.0",
]
[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "black>=24.0.0",
  "flake8>=7.0.0",
  "mypy>=1.10.0",
  "pip-tools==7.6.0",
]

[project.scripts]
start = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

[tool.black]
line-length = 88
target-version = ["py313"]
include = '\.pyi?$'
exclude = '''
(
  /(\.eggs|\.git|\.hg|\.mypy_cache|\.nox|\.tox|\.venv|_build|buck-out|build|dist)/
)
'''

[tool.mypy]
python_version = "3.13"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "silent"
exclude = [".venv", "__pycache__"]

[tool.setuptools]
# 将根目录的 main.py 作为 Python 模块安装，
# 确保 start = "main:main" 在任意目录都可以找到入口。
py-modules = ["main"]

[tool.setuptools.packages.find]
# 自动安装 app 以及它下面的所有 Python 包。
include = ["app*"]