name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev-linux.lock

      - name: 安装锁定依赖
        run: |
          python -m pip install \
            --require-hashes \
            --requirement requirements-dev-linux.lock
          python -m pip install \
            --no-deps \
            --no-build-isolation \
            --editable .

      - name: 执行统一质量检查
        run: python scripts/check.py

  frontend:
    name: Frontend quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装锁定依赖
        run: npm ci

      - name: 执行前端质量检查
        run: |
          npm run lint
          npx tsc --noEmit
          npm run build
