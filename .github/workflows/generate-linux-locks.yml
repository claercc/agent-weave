name: Generate Linux locks

on:
  # 只在需要更新依赖时手动运行。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate Python 3.13 Linux locks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: 安装依赖锁定工具
        run: python -m pip install "pip-tools==7.6.0"

      - name: 生成 Linux 锁文件
        run: |
          python -m piptools compile \
            --allow-unsafe \
            --generate-hashes \
            --strip-extras \
            --output-file requirements-linux.lock \
            pyproject.toml

          python -m piptools compile \
            --extra dev \
            --allow-unsafe \
            --generate-hashes \
            --strip-extras \
            --output-file requirements-dev-linux.lock \
            pyproject.toml

      - name: 上传 Linux 锁文件
        uses: actions/upload-artifact@v7
        with:
          name: linux-locks
          path: |
            requirements-linux.lock
            requirements-dev-linux.lock
          retention-days: 7