name: Generate dependency locks

on:
  # 只在需要更新依赖时手动运行。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate Python 3.13 locks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: 安装依赖锁定工具
        run: python -m pip install "uv==0.12.3"

      - name: 生成 Windows 和 Linux 锁文件
        run: |
          uv pip compile pyproject.toml \
            --python-platform windows \
            --python-version 3.13 \
            --generate-hashes \
            --output-file requirements.lock

          uv pip compile pyproject.toml \
            --extra dev \
            --python-platform windows \
            --python-version 3.13 \
            --generate-hashes \
            --output-file requirements-dev.lock

          uv pip compile pyproject.toml \
            --python-platform linux \
            --python-version 3.13 \
            --torch-backend cpu \
            --generate-hashes \
            --output-file requirements-linux.lock

          uv pip compile pyproject.toml \
            --extra dev \
            --python-platform linux \
            --python-version 3.13 \
            --torch-backend cpu \
            --generate-hashes \
            --output-file requirements-dev-linux.lock

      - name: 上传依赖锁文件
        uses: actions/upload-artifact@v7
        with:
          name: dependency-locks
          path: |
            requirements.lock
            requirements-dev.lock
            requirements-linux.lock
            requirements-dev-linux.lock
          retention-days: 7
